[package]
name = "assay-gate"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["lib"]

[dependencies]
soroban-sdk = "30.0.0"

# Only the tests need testutils; the library itself stays a plain no_std
# dependency an integrator's contract can pull in.
[dev-dependencies]
soroban-sdk = { version = "30.0.0", features = ["testutils"] }
# Only the tests depend on the registry crate, to register the real contract
# and call it through this crate's client (same pattern as example-gate).
assay-safety-registry = { path = "../../contracts/safety-registry" }
